[package]
name = "page-engine-service"
version = "0.1.0"
edition = "2021"
description = "Page Engine Service — Dynamic routing + Page Schema + RBAC for PlanetX ecosystem"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "auth"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "uuid"] }

# RBAC
casbin = "2"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"
